id: io.github.Big_Onche.Cube-Conflict
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: cube-conflict
finish-args:
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
modules:

  - name: SDL2_image
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL2IMAGE_DEPS_SHARED=OFF
      - -DSDL2IMAGE_STRICT=ON
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.12/SDL2_image-2.8.12.tar.gz
        sha256: 393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381

  - name: cube-conflict
    no-autogen: true
    subdir: src
    post-install:
      - install -Dm755 ../bins/cc_client -t /app/share/cube-conflict/bins
      - cp -a ../config ../media ../run.sh /app/share/cube-conflict
      - install -Dm755 ../cube-conflict.sh /app/bin/cube-conflict
      - install -Dm644 ../media/interface/cclogo.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 ../io.github.Big_Onche.Cube-Conflict.desktop -t /app/share/applications
    sources:
      - type: git
        url: https://github.com/Big-Onche/Cube-Conflict.git
        commit: bcf94c7bb5f15e5f52dac2c021ebc32fe81400d3
      - type: file
        path: cube-conflict.sh
      - type: file
        path: io.github.Big_Onche.Cube-Conflict.desktop
